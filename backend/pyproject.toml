[project]
name = "slabstack-api"
version = "0.1.0"
description = "Local-first Pokémon card grading and ROI decision engine"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI dependencies are declared as call defaults by design
  "RUF012", # ClassVar annotations are noise on Pydantic/SQLAlchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
