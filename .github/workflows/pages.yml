name: Deploy demo to GitHub Pages

# Publishes the browser-only demo build. GitHub Pages serves static files, so it
# cannot run the API or write SQLite — the demo answers its own requests in the
# browser against a sample collection. The real application is not deployed
# anywhere: it runs locally, which is the point of it.
#
# Nothing here publishes a real collection. The demo data is sample data
# compiled into the bundle, and the repository ignores `data/`.

on:
  push:
    branches:
      - main
      # Lets the demo go live before this branch is merged. Safe to drop
      # afterwards.
      - claude/pokemon-grading-roi-platform-r26ex1
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than shipping a
# half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the demo
        run: npm run build:demo

      # One-time setup, and the only manual step: enable Pages at
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      #
      # This cannot be automated. `configure-pages` can create the Pages site
      # via `enablement: true`, but only with a token that has admin rights —
      # the workflow's GITHUB_TOKEN does not, and `administration` is not a
      # grantable workflow permission. It fails with "Resource not accessible
      # by integration". So the toggle is a human's to flip, once.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
