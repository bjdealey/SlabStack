name: Deploy demo to GitHub Pages

# Publishes the browser-only demo build to https://bjdealey.github.io/SlabStack/
#
# GitHub Pages serves static files, so it cannot run the API or write SQLite —
# the demo answers its own requests in the browser against a sample collection.
# The real application is not deployed anywhere: it runs locally, which is the
# point of it.
#
# Publishing works by pushing the build to the `gh-pages` branch rather than
# using actions/deploy-pages. That is deliberate: deploy-pages needs the Pages
# source set to "GitHub Actions", and switching that source needs admin rights
# the workflow's GITHUB_TOKEN does not have (`administration` is not a grantable
# workflow permission). Pushing a gh-pages branch enables Pages on its own and
# needs nothing but `contents: write`.
#
# Nothing here publishes a real collection: the demo data is sample data
# compiled into the bundle, and the repository ignores `data/`.

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; let a running one finish rather than shipping a
# half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build the demo
        working-directory: frontend
        run: npm run build:demo

      - name: Publish to gh-pages
        working-directory: frontend/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Stops Pages running the output through Jekyll, which would drop any
          # file or directory beginning with an underscore.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy the SlabStack demo from ${GITHUB_SHA::7}

          Built with \`npm run build:demo\`. Browser-only: no API, no database,
          sample data compiled into the bundle.

          Generated by .github/workflows/pages.yml — do not edit by hand."
          # Force push: this branch is build output, not history worth keeping.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Where it landed
        run: |
          echo "### Demo deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
